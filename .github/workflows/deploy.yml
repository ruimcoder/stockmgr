name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy-azure:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APPSERVICE_PLAN: ${{ vars.AZURE_APPSERVICE_PLAN }}
      AZURE_APPSERVICE_PLAN_RESOURCE_GROUP: ${{ vars.AZURE_APPSERVICE_PLAN_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout (no external action)
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target_ref="${GH_REF_NAME:-main}"
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git fetch --depth=1 origin "$target_ref"
          git checkout --detach FETCH_HEAD
          deploy_sha="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"
          echo "Deploying ref $target_ref at commit $deploy_sha"

          if [[ "$GH_EVENT_NAME" == "push" && "$GH_SHA" != "$deploy_sha" ]]; then
            echo "Refusing stale push deployment run: workflow SHA $GH_SHA is not latest on $target_ref ($deploy_sha)." >&2
            exit 1
          fi

      - name: Preflight deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ vars.TELEGRAM_ALLOWED_CHAT_ID }}
          TELEGRAM_REQUIRE_PRIVATE_CHAT: ${{ vars.TELEGRAM_REQUIRE_PRIVATE_CHAT }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          missing=()
          required=(
            AZURE_RESOURCE_GROUP
            AZURE_APPSERVICE_PLAN
            AZURE_WEBAPP_NAME
            AZURE_SUBSCRIPTION_ID
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            GHCR_USERNAME
            GHCR_TOKEN
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          auth_mode_normalized="${AUTH_MODE,,}"
          if [[ "$auth_mode_normalized" == "google" || "$auth_mode_normalized" == "oauth" ]]; then
            [[ -z "${GOOGLE_CLIENT_ID:-}" ]] && missing+=("GOOGLE_CLIENT_ID (required by AUTH_MODE=$AUTH_MODE)")
            [[ -z "${GOOGLE_CLIENT_SECRET:-}" ]] && missing+=("GOOGLE_CLIENT_SECRET (required by AUTH_MODE=$AUTH_MODE)")
          fi
          if [[ "$auth_mode_normalized" == "microsoft" || "$auth_mode_normalized" == "oauth" ]]; then
            [[ -z "${MICROSOFT_CLIENT_ID:-}" ]] && missing+=("MICROSOFT_CLIENT_ID (required by AUTH_MODE=$AUTH_MODE)")
            [[ -z "${MICROSOFT_CLIENT_SECRET:-}" ]] && missing+=("MICROSOFT_CLIENT_SECRET (required by AUTH_MODE=$AUTH_MODE)")
          fi
          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" || -n "${TELEGRAM_WEBHOOK_SECRET:-}" || -n "${TELEGRAM_ALLOWED_USER_ID:-}" || -n "${TELEGRAM_ALLOWED_CHAT_ID:-}" ]]; then
            [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]] && missing+=("TELEGRAM_BOT_TOKEN (required when Telegram integration is enabled)")
            [[ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]] && missing+=("TELEGRAM_WEBHOOK_SECRET (required when Telegram integration is enabled)")
            [[ -z "${TELEGRAM_ALLOWED_USER_ID:-}" ]] && missing+=("TELEGRAM_ALLOWED_USER_ID (required when Telegram integration is enabled)")
            [[ -z "${TELEGRAM_ALLOWED_CHAT_ID:-}" ]] && missing+=("TELEGRAM_ALLOWED_CHAT_ID (required when Telegram integration is enabled)")
          fi

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "Deploying ref: $GITHUB_REF"

      - name: Azure login (OIDC, no external action)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [[ -z "${AZURE_CLIENT_ID:-}" || -z "${AZURE_TENANT_ID:-}" || -z "${AZURE_SUBSCRIPTION_ID:-}" ]]; then
            echo "AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID are required." >&2
            exit 1
          fi

          oidc_token="$(
            curl -sSfL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | python -c "import json,sys; print(json.load(sys.stdin)['value'])"
          )"

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$oidc_token" \
            --output none

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Validate Azure infrastructure
        run: |
          sed -i 's/\r$//' scripts/azure/validate_infra.sh
          OUTPUT_ENV_FILE="$GITHUB_ENV" bash scripts/azure/validate_infra.sh

      - name: Login to GHCR (no external action)
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Build and push image (no external action)
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          image_latest="ghcr.io/${GH_REPOSITORY}:latest"
          image_sha="ghcr.io/${GH_REPOSITORY}:${DEPLOY_SHA}"
          docker build -t "$image_latest" -t "$image_sha" .
          docker push "$image_latest"
          docker push "$image_sha"

      - name: Configure Azure Web App container
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ vars.TELEGRAM_ALLOWED_CHAT_ID }}
          TELEGRAM_REQUIRE_PRIVATE_CHAT: ${{ vars.TELEGRAM_REQUIRE_PRIVATE_CHAT }}
          CALENDAR_PROVIDER: ${{ vars.CALENDAR_PROVIDER }}
          RENEWAL_WINDOW_DAYS: ${{ vars.RENEWAL_WINDOW_DAYS }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          EXCEL_API_KEY: ${{ secrets.EXCEL_API_KEY }}
          EXCEL_API_USER_EMAIL: ${{ vars.EXCEL_API_USER_EMAIL }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          if [[ -z "${GHCR_USERNAME:-}" || -z "${GHCR_TOKEN:-}" ]]; then
            echo "GHCR_USERNAME and GHCR_TOKEN secrets are required for Azure pull access." >&2
            exit 1
          fi
          if [[ -z "${DEPLOY_SHA:-}" ]]; then
            echo "DEPLOY_SHA was not set by checkout step." >&2
            exit 1
          fi

          public_base_url="${PUBLIC_BASE_URL:-${AZURE_WEBAPP_URL:-}}"
          image_name="ghcr.io/${GITHUB_REPOSITORY}:${DEPLOY_SHA}"
          persistent_database_url="${DATABASE_URL:-sqlite:////home/site/data/stockmgr.db}"

          az webapp config container set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$image_name" \
            --container-registry-url "https://ghcr.io" \
            --container-registry-user "$GHCR_USERNAME" \
            --container-registry-password "$GHCR_TOKEN"

          app_settings=(
            "WEBSITES_PORT=8000"
            "WEBSITES_ENABLE_APP_SERVICE_STORAGE=true"
            "ENVIRONMENT=production"
            "APP_VERSION=$DEPLOY_SHA"
            "DATABASE_URL=$persistent_database_url"
          )

          [[ -n "${SECRET_KEY:-}" ]] && app_settings+=("SECRET_KEY=$SECRET_KEY")
          [[ -n "${public_base_url:-}" ]] && app_settings+=("PUBLIC_BASE_URL=$public_base_url")
          [[ -n "${AUTH_MODE:-}" ]] && app_settings+=("AUTH_MODE=$AUTH_MODE")
          [[ -n "${GOOGLE_CLIENT_ID:-}" ]] && app_settings+=("GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID")
          [[ -n "${GOOGLE_CLIENT_SECRET:-}" ]] && app_settings+=("GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET")
          [[ -n "${MICROSOFT_CLIENT_ID:-}" ]] && app_settings+=("MICROSOFT_CLIENT_ID=$MICROSOFT_CLIENT_ID")
          [[ -n "${MICROSOFT_CLIENT_SECRET:-}" ]] && app_settings+=("MICROSOFT_CLIENT_SECRET=$MICROSOFT_CLIENT_SECRET")
          [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]] && app_settings+=("TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN")
          [[ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ]] && app_settings+=("TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET")
          [[ -n "${TELEGRAM_ALLOWED_USER_ID:-}" ]] && app_settings+=("TELEGRAM_ALLOWED_USER_ID=$TELEGRAM_ALLOWED_USER_ID")
          [[ -n "${TELEGRAM_ALLOWED_CHAT_ID:-}" ]] && app_settings+=("TELEGRAM_ALLOWED_CHAT_ID=$TELEGRAM_ALLOWED_CHAT_ID")
          [[ -n "${TELEGRAM_REQUIRE_PRIVATE_CHAT:-}" ]] && app_settings+=("TELEGRAM_REQUIRE_PRIVATE_CHAT=$TELEGRAM_REQUIRE_PRIVATE_CHAT")
          [[ -n "${CALENDAR_PROVIDER:-}" ]] && app_settings+=("CALENDAR_PROVIDER=$CALENDAR_PROVIDER")
          [[ -n "${RENEWAL_WINDOW_DAYS:-}" ]] && app_settings+=("RENEWAL_WINDOW_DAYS=$RENEWAL_WINDOW_DAYS")
          [[ -n "${ADMIN_EMAILS:-}" ]] && app_settings+=("ADMIN_EMAILS=$ADMIN_EMAILS")
          [[ -n "${EXCEL_API_KEY:-}" ]] && app_settings+=("EXCEL_API_KEY=$EXCEL_API_KEY")
          [[ -n "${EXCEL_API_USER_EMAIL:-}" ]] && app_settings+=("EXCEL_API_USER_EMAIL=$EXCEL_API_USER_EMAIL")

          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings "${app_settings[@]}"

          az webapp restart \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP"

      - name: Smoke test deployed app
        run: |
          sed -i 's/\r$//' scripts/azure/smoke_test.sh
          EXPECTED_APP_VERSION="$DEPLOY_SHA" bash scripts/azure/smoke_test.sh
