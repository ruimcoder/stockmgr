name: Device Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["dev", "main"]

jobs:
  cross-device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install --save-dev @playwright/test@1.54.2

      - name: Install Playwright browsers
        run: npx --yes playwright@1.54.2 install --with-deps chromium firefox webkit

      - name: Start app
        run: |
          SMOKE_EMAIL_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ADMIN_EMAILS="device.firefox+${SMOKE_EMAIL_SUFFIX}@example.com,device.chromium+${SMOKE_EMAIL_SUFFIX}@example.com,device.webkit+${SMOKE_EMAIL_SUFFIX}@example.com"
          nohup env ADMIN_EMAILS="${ADMIN_EMAILS}" uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("App did not become healthy in time.")
          PY

      - name: Run Playwright smoke tests
        env:
          SMOKE_EMAIL_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npx --yes playwright@1.54.2 test -c playwright.config.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            uvicorn.log
