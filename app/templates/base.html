<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stockmgr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', path='site.css') }}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/">stockmgr</a>
        <div class="d-flex gap-2 align-items-center">
          <a class="btn btn-sm btn-outline-primary" href="/items/new">{{ t("nav.add_item") }}</a>
          <a class="btn btn-sm btn-outline-secondary" href="/items/import">{{ t("nav.import") }}</a>
          <div class="btn-group btn-group-sm" role="group" aria-label="{{ t('nav.language') }}">
            <a class="btn btn-outline-dark {% if lang == 'en' %}active{% endif %}" href="/lang/en">{{ t("lang.en") }}</a>
            <a class="btn btn-outline-dark {% if lang == 'pt' %}active{% endif %}" href="/lang/pt">{{ t("lang.pt") }}</a>
          </div>
          <a class="btn btn-sm btn-outline-danger" href="/auth/logout">{{ t("nav.logout") }}</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
