{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{{ t("admin.enrich_title") }}</h1>

{% if message %}
<div class="alert alert-info py-2">{{ t("msg.enrich-done") }} ({{ enriched_count }})</div>
{% endif %}

<div class="card">
  <div class="card-header">{{ t("admin.enrich_title") }}</div>
  <div class="card-body">
    <p class="text-muted mb-3">{{ t("admin.enrich_description") }}</p>
    <form method="post" action="/admin/enrich-items">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}" />
      <button class="btn btn-outline-primary" type="submit">{{ t("admin.enrich_button") }}</button>
    </form>
  </div>
</div>
{% endblock %}
