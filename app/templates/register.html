<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stockmgr register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">{{ t("register.title") }}</h1>
                <div class="btn-group btn-group-sm">
                  <a class="btn btn-outline-dark {% if lang == 'en' %}active{% endif %}" href="/lang/en">{{ t("lang.en") }}</a>
                  <a class="btn btn-outline-dark {% if lang == 'pt' %}active{% endif %}" href="/lang/pt">{{ t("lang.pt") }}</a>
                </div>
              </div>
              {% if message %}
              <div class="alert alert-info py-2">{{ t("msg." ~ message) }}</div>
              {% endif %}
              <form method="post" action="/register">
                <div class="mb-2">
                  <label class="form-label">{{ t("register.email") }}</label>
                  <input class="form-control" name="email" type="email" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">{{ t("register.display_name") }}</label>
                  <input class="form-control" name="display_name" required />
                </div>
                <button class="btn btn-primary" type="submit">{{ t("register.submit") }}</button>
                <a class="btn btn-outline-secondary" href="/login">{{ t("register.back_to_login") }}</a>
              </form>
              <small class="text-muted d-block mt-3">{{ t("register.approval_note") }}</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
